[project]
name = "py-practice"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Philip Shaji Baby", email = "philipshajibaby@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "httpx>=0.28.1",
    "pydantic>=2.14.1",
    "pydantic-settings>=2.15.0",
    "tenacity>=9.2.1",
]

[project.scripts]
py-practice = "py_practice:main"

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "ruff>=0.17.0",
]
